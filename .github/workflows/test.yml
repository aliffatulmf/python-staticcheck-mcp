name: Test

on:
  push:
    paths:
      - "**/*.py"
      - "**/*.toml"
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.toml"

env:
  UV_VERSION: "latest"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        os:
          - ubuntu-latest
          - windows-latest
    permissions:
      contents: read
      checks: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.python-version }}-${{ matrix.os }}
      cancel-in-progress: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pytest with coverage
        run: uv run pytest -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage.xml
          flags: unittests-${{ matrix.python-version }}-${{ matrix.os }}
          fail_ci_if_error: false
          verbose: true

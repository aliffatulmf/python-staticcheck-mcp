[project]
name = "staticcheck-mcp"
version = "0.1.0"
description = "FastMCP server for Go staticcheck with stdio and sse transports"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0.0", "fastmcp>=3.0.2"]

[project.scripts]
staticcheck-mcp = "staticcheck_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/staticcheck_mcp"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "mypy>=1.19.1",
    "pylint>=4.0.5",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "standard"

[tool.pylint.'MESSAGES CONTROL']
disable = ["C0114", "C0115", "C0116"]

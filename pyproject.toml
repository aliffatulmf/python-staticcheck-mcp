[project]
name = "python-staticcheck-mcp"
version = "0.2.0"
description = "Automated Go code analysis and error explanation with staticcheck."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0.0",
    "fastmcp>=3.0.2",
]

[project.scripts]
python-staticcheck-mcp = "python_staticcheck_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_staticcheck_mcp"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "mypy>=1.19.1",
    "pylint>=4.0.5",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
